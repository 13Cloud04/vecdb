name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pybind11 pytest
      - run: make test
      - run: make asan
      - run: make tsan
      - run: make py && pytest -q tests/test_python.py
